<div class="page-shell" *ngIf="config">
  <div class="page-header">
    <div>
      <h2 class="mb-1">{{ id ? 'Modifier' : 'Nouveau' }} {{ config.title }}</h2>
      <div class="muted-text">Saisissez les informations puis enregistrez la fiche</div>
    </div>
  </div>

  <mat-card class="form-card">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="save()" class="row g-3">
        <div *ngFor="let field of config.fields" [class]="field.type === 'textarea' ? 'col-12' : 'col-md-6'">
          <mat-form-field class="w-100" *ngIf="field.type !== 'select' && field.type !== 'textarea'">
            <mat-label>{{ field.label }}</mat-label>
            <input matInput [type]="field.type || 'text'" [formControlName]="field.name" />
            <mat-error *ngIf="form.get(field.name)?.hasError('required')">Ce champ est obligatoire.</mat-error>
          </mat-form-field>

          <mat-form-field class="w-100" *ngIf="field.type === 'textarea'">
            <mat-label>{{ field.label }}</mat-label>
            <textarea matInput rows="3" [formControlName]="field.name"></textarea>
          </mat-form-field>

          <mat-form-field class="w-100" *ngIf="field.type === 'select'">
            <mat-label>{{ field.label }}</mat-label>
            <mat-select [formControlName]="field.name">
              <mat-option *ngFor="let option of field.options" [value]="option.value">{{ option.label }}</mat-option>
            </mat-select>
            <mat-error *ngIf="form.get(field.name)?.hasError('required')">Ce champ est obligatoire.</mat-error>
          </mat-form-field>
        </div>

        <div class="col-12 d-flex justify-content-end gap-2">
          <a mat-stroked-button [routerLink]="listRoute">Annuler</a>
          <button mat-flat-button color="primary" type="submit" [disabled]="loading">
            {{ loading ? 'Enregistrement...' : 'Enregistrer' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
