<div class="page-shell">
  <div class="page-header">
    <div>
      <h2 class="mb-1">Reproduction</h2>
      <div class="muted-text">Suivi des cycles et événements de reproduction</div>
    </div>
    <a mat-flat-button color="primary" routerLink="/reproductions/nouveau"><mat-icon>add</mat-icon> Nouvelle reproduction</a>
  </div>

  <mat-card class="table-card">
    <mat-card-content>
      <table mat-table [dataSource]="cycles" class="w-100">
        <ng-container matColumnDef="animal">
          <th mat-header-cell *matHeaderCellDef>Animal</th>
          <td mat-cell *matCellDef="let item">{{ item.animal }}</td>
        </ng-container>

        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Type</th>
          <td mat-cell *matCellDef="let item">{{ item.type }}</td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let item">{{ item.date }}</td>
        </ng-container>

        <ng-container matColumnDef="etat">
          <th mat-header-cell *matHeaderCellDef>État</th>
          <td mat-cell *matCellDef="let item">{{ item.etat }}</td>
        </ng-container>

        <ng-container matColumnDef="dureeEstimee">
          <th mat-header-cell *matHeaderCellDef>Durée estimée</th>
          <td mat-cell *matCellDef="let item">{{ item.dureeEstimee }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
