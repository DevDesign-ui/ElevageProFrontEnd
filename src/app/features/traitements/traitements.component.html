<div class="page-shell">
  <div class="page-header">
    <div>
      <h2 class="mb-1">Traitements</h2>
      <div class="muted-text">Suivi médical et traitements appliqués</div>
    </div>
    <a mat-flat-button color="primary" routerLink="/traitements/nouveau"><mat-icon>add</mat-icon> Nouveau traitement</a>
  </div>

  <mat-card class="table-card">
    <mat-card-content>
      <table mat-table [dataSource]="traitements" class="w-100">
        <ng-container matColumnDef="animal">
          <th mat-header-cell *matHeaderCellDef>Animal</th>
          <td mat-cell *matCellDef="let item">{{ item.animal }}</td>
        </ng-container>

        <ng-container matColumnDef="traitement">
          <th mat-header-cell *matHeaderCellDef>Traitement</th>
          <td mat-cell *matCellDef="let item">{{ item.traitement }}</td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let item">{{ item.date }}</td>
        </ng-container>

        <ng-container matColumnDef="duree">
          <th mat-header-cell *matHeaderCellDef>Durée</th>
          <td mat-cell *matCellDef="let item">{{ item.duree }}</td>
        </ng-container>

        <ng-container matColumnDef="statut">
          <th mat-header-cell *matHeaderCellDef>Statut</th>
          <td mat-cell *matCellDef="let item">
            <span class="badge" [ngClass]="item.statut === 'En cours' ? 'badge-warning' : 'badge-success'">
              {{ item.statut }}
            </span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
