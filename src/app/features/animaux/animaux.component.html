<div class="page-shell">
  <div class="page-header">
    <div>
      <h2 class="mb-1">Animaux</h2>
      <div class="muted-text">Gestion du cheptel</div>
    </div>
    <button mat-flat-button color="primary" routerLink="/animaux/nouveau">
      <mat-icon>add</mat-icon>
      Ajouter un animal
    </button>
  </div>

  <mat-card class="table-card">
    <mat-card-content>
      <table mat-table [dataSource]="animals" class="w-100">
        <ng-container matColumnDef="identifiant">
          <th mat-header-cell *matHeaderCellDef>Identifiant</th>
          <td mat-cell *matCellDef="let animal">{{ animal.identifiant }}</td>
        </ng-container>

        <ng-container matColumnDef="nom">
          <th mat-header-cell *matHeaderCellDef>Nom</th>
          <td mat-cell *matCellDef="let animal">{{ animal.nom }}</td>
        </ng-container>

        <ng-container matColumnDef="espece">
          <th mat-header-cell *matHeaderCellDef>Espèce</th>
          <td mat-cell *matCellDef="let animal">{{ animal.espece }}</td>
        </ng-container>

        <ng-container matColumnDef="race">
          <th mat-header-cell *matHeaderCellDef>Race</th>
          <td mat-cell *matCellDef="let animal">{{ animal.race }}</td>
        </ng-container>

        <ng-container matColumnDef="sexe">
          <th mat-header-cell *matHeaderCellDef>Sexe</th>
          <td mat-cell *matCellDef="let animal">{{ animal.sexe }}</td>
        </ng-container>

        <ng-container matColumnDef="statut">
          <th mat-header-cell *matHeaderCellDef>Statut</th>
          <td mat-cell *matCellDef="let animal">
            <span class="badge" [ngClass]="{
              'badge-success': animal.statut === 'PRESENT',
              'badge-warning': animal.statut === 'VENDU',
              'badge-danger': animal.statut === 'DECEDE',
              'badge-info': animal.statut === 'TRANSFERE'
            }">{{ animal.statut }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let animal">
            <button mat-icon-button [routerLink]="['/animaux', animal.id]">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button [routerLink]="['/animaux', animal.id, 'modifier']">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="delete(animal.id!)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
