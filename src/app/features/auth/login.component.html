<div class="auth-wrapper">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Connexion</mat-card-title>
      <mat-card-subtitle>ÉleveurPro – Gestion d’exploitation</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <mat-form-field>
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="admin@eleveurpro.com" />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Mot de passe</mat-label>
          <input matInput formControlName="password" type="password" placeholder="••••••••" />
        </mat-form-field>

        <div class="form-error" *ngIf="form.errors?.['invalidLogin']">
          Email ou mot de passe incorrect.
        </div>

        <button mat-flat-button color="primary" type="submit" class="w-100">
          Se connecter
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <a mat-button routerLink="/register">Créer un compte</a>
    </mat-card-actions>
  </mat-card>
</div>
