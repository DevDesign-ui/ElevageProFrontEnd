<div class="auth-wrapper">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Inscription</mat-card-title>
      <mat-card-subtitle>Créer un compte gestionnaire</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <div class="row g-2">
          <div class="col-md-6">
            <mat-form-field>
              <mat-label>Prénom</mat-label>
              <input matInput formControlName="firstName" />
            </mat-form-field>
          </div>
          <div class="col-md-6">
            <mat-form-field>
              <mat-label>Nom</mat-label>
              <input matInput formControlName="lastName" />
            </mat-form-field>
          </div>
        </div>

        <mat-form-field>
          <mat-label>Nom d’utilisateur</mat-label>
          <input matInput formControlName="username" />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Mot de passe</mat-label>
          <input matInput formControlName="password" type="password" />
        </mat-form-field>

        <div class="form-error" *ngIf="form.errors?.['registerFailed']">
          Impossible de créer le compte pour le moment.
        </div>

        <button mat-flat-button color="primary" type="submit" class="w-100">
          S’inscrire
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <a mat-button routerLink="/login">Déjà inscrit ? Se connecter</a>
    </mat-card-actions>
  </mat-card>
</div>
