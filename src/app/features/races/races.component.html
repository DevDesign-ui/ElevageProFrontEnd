<div class="page-shell">
  <div class="page-header">
    <div>
      <h2 class="mb-1">Races</h2>
      <div class="muted-text">Association race → espèce</div>
    </div>
    <a mat-flat-button color="primary" routerLink="/races/nouveau">
      <mat-icon>add</mat-icon>
      Ajouter une race
    </a>
  </div>

  <mat-card class="table-card">
    <mat-card-content>
      <table mat-table [dataSource]="races" class="w-100">
        <ng-container matColumnDef="nom">
          <th mat-header-cell *matHeaderCellDef>Race</th>
          <td mat-cell *matCellDef="let race">{{ race.nom }}</td>
        </ng-container>

        <ng-container matColumnDef="espece">
          <th mat-header-cell *matHeaderCellDef>Espèce</th>
          <td mat-cell *matCellDef="let race">{{ race.espece }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let race">
            <a mat-icon-button [routerLink]="['/races', race.id, 'modifier']"><mat-icon>edit</mat-icon></a>
            <button mat-icon-button color="warn" (click)="delete(race.id)"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
