<div class="page-shell">
  <div class="page-header">
    <div>
      <h2 class="mb-1">Ventes</h2>
      <div class="muted-text">Historique commercial et revenus générés</div>
    </div>
    <a mat-flat-button color="primary" routerLink="/ventes/nouveau"><mat-icon>add</mat-icon> Nouvelle vente</a>
  </div>

  <mat-card class="table-card">
    <mat-card-content>
      <table mat-table [dataSource]="ventes" class="w-100">
        <ng-container matColumnDef="client">
          <th mat-header-cell *matHeaderCellDef>Client</th>
          <td mat-cell *matCellDef="let item">{{ item.client }}</td>
        </ng-container>

        <ng-container matColumnDef="reference">
          <th mat-header-cell *matHeaderCellDef>Référence</th>
          <td mat-cell *matCellDef="let item">{{ item.reference }}</td>
        </ng-container>

        <ng-container matColumnDef="montant">
          <th mat-header-cell *matHeaderCellDef>Montant</th>
          <td mat-cell *matCellDef="let item">{{ item.montant | number:'1.0-0' }} FCFA</td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let item">{{ item.date }}</td>
        </ng-container>

        <ng-container matColumnDef="statut">
          <th mat-header-cell *matHeaderCellDef>Statut</th>
          <td mat-cell *matCellDef="let item">
            <span class="badge" [ngClass]="item.statut === 'Livraison' ? 'badge-warning' : 'badge-success'">
              {{ item.statut }}
            </span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
