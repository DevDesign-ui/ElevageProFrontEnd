<div class="page-shell">
  <div class="page-header">
    <div>
      <h2 class="mb-1">Naissances</h2>
      <div class="muted-text">Suivi des naissances et état des jeunes animaux</div>
    </div>
    <a mat-flat-button color="primary" routerLink="/naissances/nouveau"><mat-icon>add</mat-icon> Nouvelle naissance</a>
  </div>

  <mat-card class="table-card">
    <mat-card-content>
      <table mat-table [dataSource]="naissances" class="w-100">
        <ng-container matColumnDef="animal">
          <th mat-header-cell *matHeaderCellDef>Animal</th>
          <td mat-cell *matCellDef="let item">{{ item.animal }}</td>
        </ng-container>

        <ng-container matColumnDef="sexe">
          <th mat-header-cell *matHeaderCellDef>Sexe</th>
          <td mat-cell *matCellDef="let item">{{ item.sexe }}</td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let item">{{ item.date }}</td>
        </ng-container>

        <ng-container matColumnDef="poids">
          <th mat-header-cell *matHeaderCellDef>Poids</th>
          <td mat-cell *matCellDef="let item">{{ item.poids }}</td>
        </ng-container>

        <ng-container matColumnDef="statut">
          <th mat-header-cell *matHeaderCellDef>Statut</th>
          <td mat-cell *matCellDef="let item">
            <span class="badge" [ngClass]="item.statut === 'Surveillance' ? 'badge-warning' : 'badge-success'">
              {{ item.statut }}
            </span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
