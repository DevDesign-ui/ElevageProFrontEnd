<div class="page-shell">
  <div class="page-header">
    <div>
      <h2 class="mb-1">Notifications</h2>
      <div class="muted-text">Alertes et rappels d’activité</div>
    </div>
  </div>

  <mat-card class="table-card">
    <mat-card-content>
      <table mat-table [dataSource]="notifications" class="w-100">
        <ng-container matColumnDef="titre">
          <th mat-header-cell *matHeaderCellDef>Titre</th>
          <td mat-cell *matCellDef="let item">{{ item.titre }}</td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let item">{{ item.date }}</td>
        </ng-container>

        <ng-container matColumnDef="niveau">
          <th mat-header-cell *matHeaderCellDef>Niveau</th>
          <td mat-cell *matCellDef="let item">
            <span class="badge" [ngClass]="item.niveau === 'Important' ? 'badge-warning' : 'badge-success'">
              {{ item.niveau }}
            </span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
